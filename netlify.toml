[[plugins]]
  package = "@netlify/plugin-nextjs"

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  BUN_VERSION = "1.4.4"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


[context.deploy-preview.environment]
  SHOW_TEST_PAGES = "true"