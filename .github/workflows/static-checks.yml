name: Lint and Types Check

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  lint-and-types:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Turbopack's persistent build cache; cuts compile time on warm runs.
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
            nextjs-${{ runner.os }}-

      - name: Build
        run: bun run build

      - name: Run Lint
        run: bun run lint

      - name: Run Types Check
        run: bun run types

      - name: Unit Tests
        run: bun run test
